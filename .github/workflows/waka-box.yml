# 每天自动更新 README 中的 wakatime 编码统计
# 1. waka-readme：语言统计（<!--START_SECTION:waka-->）
# 2. 自定义脚本：详细统计（<!--START_SECTION:devstats-->），含 AI 编码详情/编辑器/OS/项目
name: Waka Readme

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * *'

permissions:
  contents: write

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    steps:
      # 第一步：语言统计（由 waka-readme 内部完成 checkout + commit + push）
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true                 # 显示统计周期
          SHOW_MASKED_TIME: true           # 显示含未分类的总时长
          SHOW_TIME: true                  # 显示各语言时长
          LANG_COUNT: 15                   # 展示 15 种语言（默认 5）
          IGNORED_LANGUAGES: "RPMSpec Git Config INI"  # 过滤非编码噪音语言

      # 第二步：拉取 waka-readme 提交后的最新代码
      - name: Checkout
        uses: actions/checkout@v4

      # 第三步：生成详细统计区块（AI 编码/编辑器/OS/类别/项目）
      - name: Update detailed dev stats
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 .github/scripts/waka_stats.py

      # 第四步：提交并推送 devstats 区块
      - name: Commit detailed stats
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update wakatime detailed stats"
            git push
          else
            echo "README 无变化，跳过提交"
          fi
